<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cloud Diary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    min-height: 100vh;
    padding: 20px;
  }

  h2 {
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  /* LOGIN */
  #loginBox {
    max-width: 400px;
    margin: 80px auto;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 36px 32px;
  }

  #loginBox h2 { margin-bottom: 28px; }

  .input-group {
    margin-bottom: 14px;
  }

  .input-group label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }

  .input-group input {
    width: 100%;
    padding: 12px 16px;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus { border-color: #7c6af7; }

  #loginBtn {
    width: 100%;
    padding: 13px;
    background: #7c6af7;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }

  #loginBtn:hover { background: #6a58e0; }

  #msg {
    text-align: center;
    color: #e05757;
    font-size: 14px;
    margin-top: 12px;
    min-height: 20px;
  }

  /* DIARY */
  #diary {
    max-width: 700px;
    margin: 0 auto;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .top-bar h2 { margin-bottom: 0; }

  #logoutBtn {
    background: #1f1f1f;
    border: 1px solid #333;
    color: #aaa;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }

  #logoutBtn:hover { background: #2a2a2a; color: #f0f0f0; }

  /* WRITE BOX */
  .write-box {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .mood-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .mood-row label {
    font-size: 13px;
    color: #888;
    margin-right: 6px;
    align-self: center;
  }

  .mood-btn {
    background: #111;
    border: 1px solid #333;
    border-radius: 20px;
    padding: 6px 14px;
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mood-btn:hover, .mood-btn.active {
    background: #7c6af7;
    border-color: #7c6af7;
    color: white;
  }

  #text {
    width: 100%;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 15px;
    padding: 14px;
    resize: vertical;
    min-height: 120px;
    outline: none;
    font-family: Arial, sans-serif;
    line-height: 1.6;
    transition: border-color 0.2s;
  }

  #text:focus { border-color: #7c6af7; }

  .write-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  #charCount {
    font-size: 13px;
    color: #555;
  }

  #saveBtn {
    background: #7c6af7;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #saveBtn:hover { background: #6a58e0; }

  /* STATS ROW */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
  }

  .stat-card .num {
    font-size: 24px;
    font-weight: 700;
    color: #7c6af7;
  }

  .stat-card .lbl {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }

  /* SEARCH */
  #search {
    width: 100%;
    padding: 12px 16px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  #search:focus { border-color: #7c6af7; }

  /* ENTRIES */
  .entry {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .entry:hover { border-color: #3a3a3a; }

  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .entry-meta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .entry-date {
    font-size: 13px;
    color: #666;
  }

  .entry-mood-tag {
    font-size: 12px;
    background: #2a2a2a;
    border-radius: 20px;
    padding: 3px 10px;
    color: #aaa;
  }

  .entry-actions { display: flex; gap: 8px; }

  .entry-actions button {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 6px 12px;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .entry-actions button:hover { background: #222; color: #f0f0f0; border-color: #444; }

  .del-btn:hover { color: #e05757 !important; border-color: #e05757 !important; }

  .entry-text {
    font-size: 15px;
    line-height: 1.7;
    color: #ccc;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .entry-wordcount {
    font-size: 12px;
    color: #444;
    margin-top: 10px;
  }

  #noEntries {
    text-align: center;
    color: #444;
    padding: 40px;
    font-size: 15px;
  }

  .hidden { display: none !important; }

  /* EDIT MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }

  .modal-box {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
  }

  .modal-box h3 {
    font-size: 18px;
    margin-bottom: 16px;
    color: #f0f0f0;
  }

  .modal-box textarea {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 15px;
    padding: 14px;
    resize: vertical;
    min-height: 140px;
    outline: none;
    font-family: Arial, sans-serif;
    line-height: 1.6;
  }

  .modal-box textarea:focus { border-color: #7c6af7; }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 16px;
  }

  .modal-footer button {
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
    border: 1px solid #333;
  }

  #cancelEdit { background: #111; color: #aaa; }
  #cancelEdit:hover { background: #222; }
  #confirmEdit { background: #7c6af7; color: white; border-color: #7c6af7; }
  #confirmEdit:hover { background: #6a58e0; }

  .loading {
    text-align: center;
    color: #555;
    padding: 30px;
    font-size: 15px;
  }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  query,
  orderBy,
  doc,
  deleteDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8hfYjGN1EgB7K8x77p_ky84ssuWS8EkI",
  authDomain: "my-diary-app-ee165.firebaseapp.com",
  projectId: "my-diary-app-ee165"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USER = "yusufsodiq082@gmail.com";
const PASS = "a336336a";

let selectedMood = "";
let allEntries = [];
let editingDocId = null;

window.addEventListener("DOMContentLoaded", () => {
  const emailEl    = document.getElementById("email");
  const passEl     = document.getElementById("password");
  const loginBtn   = document.getElementById("loginBtn");
  const loginBox   = document.getElementById("loginBox");
  const diary      = document.getElementById("diary");
  const msgEl      = document.getElementById("msg");
  const textEl     = document.getElementById("text");
  const saveBtn    = document.getElementById("saveBtn");
  const entriesDiv = document.getElementById("entries");
  const searchEl   = document.getElementById("search");
  const charCount  = document.getElementById("charCount");
  const logoutBtn  = document.getElementById("logoutBtn");
  const totalEl    = document.getElementById("totalEntries");
  const streakEl   = document.getElementById("streak");
  const wordsEl    = document.getElementById("totalWords");
  const modalOverlay = document.getElementById("modalOverlay");
  const editTextarea = document.getElementById("editTextarea");
  const cancelEdit   = document.getElementById("cancelEdit");
  const confirmEdit  = document.getElementById("confirmEdit");

  // Mood buttons
  document.querySelectorAll(".mood-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedMood = btn.dataset.mood;
    };
  });

  // Char count
  textEl.oninput = () => {
    const len = textEl.value.length;
    charCount.textContent = len + " characters";
  };

  // Login
  loginBtn.onclick = () => {
    if (emailEl.value.trim() === USER && passEl.value === PASS) {
      loginBox.classList.add("hidden");
      diary.classList.remove("hidden");
      loadEntries();
    } else {
      msgEl.textContent = "❌ Incorrect email or password";
    }
  };

  // Enter key login
  passEl.onkeydown = e => { if (e.key === "Enter") loginBtn.click(); };

  // Logout
  logoutBtn.onclick = () => {
    diary.classList.add("hidden");
    loginBox.classList.remove("hidden");
    emailEl.value = "";
    passEl.value = "";
    msgEl.textContent = "";
  };

  // Save
  saveBtn.onclick = async () => {
    const txt = textEl.value.trim();
    if (!txt) { alert("Write something first!"); return; }
    saveBtn.textContent = "Saving...";
    saveBtn.disabled = true;
    await addDoc(collection(db, "diary"), {
      text: txt,
      mood: selectedMood,
      time: Date.now()
    });
    textEl.value = "";
    charCount.textContent = "0 characters";
    selectedMood = "";
    document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
    saveBtn.textContent = "✚ Save Entry";
    saveBtn.disabled = false;
    loadEntries();
  };

  // Load
  async function loadEntries() {
    entriesDiv.innerHTML = '<div class="loading">Loading entries...</div>';
    const q = query(collection(db, "diary"), orderBy("time", "desc"));
    const snapshot = await getDocs(q);
    allEntries = [];
    snapshot.forEach(docSnap => {
      allEntries.push({ id: docSnap.id, ...docSnap.data() });
    });
    updateStats();
    renderEntries(allEntries);
  }

  function updateStats() {
    totalEl.textContent = allEntries.length;
    const totalWords = allEntries.reduce((sum, e) => sum + e.text.trim().split(/\s+/).filter(Boolean).length, 0);
    wordsEl.textContent = totalWords.toLocaleString();

    // Streak: count consecutive days with entries (from today backwards)
    const days = new Set(allEntries.map(e => new Date(e.time).toDateString()));
    let streak = 0;
    let d = new Date();
    while (days.has(d.toDateString())) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    streakEl.textContent = streak;
  }

  function renderEntries(list) {
    entriesDiv.innerHTML = "";
    if (list.length === 0) {
      entriesDiv.innerHTML = '<div id="noEntries">No entries yet. Write your first one! ✨</div>';
      return;
    }
    list.forEach(entry => {
      const div = document.createElement("div");
      div.className = "entry";
      const date = new Date(entry.time).toLocaleString();
      const wordCount = entry.text.trim().split(/\s+/).filter(Boolean).length;
      const moodTag = entry.mood ? `<span class="entry-mood-tag">${entry.mood}</span>` : "";

      div.innerHTML = `
        <div class="entry-header">
          <div class="entry-meta">
            <span class="entry-date">📅 ${date}</span>
            ${moodTag}
          </div>
          <div class="entry-actions">
            <button class="editBtn">✏️ Edit</button>
            <button class="delBtn del-btn">🗑️ Delete</button>
          </div>
        </div>
        <div class="entry-text">${escapeHtml(entry.text)}</div>
        <div class="entry-wordcount">${wordCount} words</div>
      `;

      entriesDiv.appendChild(div);

      div.querySelector(".delBtn").onclick = async () => {
        if (confirm("Delete this entry? This cannot be undone.")) {
          await deleteDoc(doc(db, "diary", entry.id));
          loadEntries();
        }
      };

      div.querySelector(".editBtn").onclick = () => {
        editingDocId = entry.id;
        editTextarea.value = entry.text;
        modalOverlay.classList.remove("hidden");
      };
    });
  }

  // Edit modal
  cancelEdit.onclick = () => {
    modalOverlay.classList.add("hidden");
    editingDocId = null;
  };

  confirmEdit.onclick = async () => {
    const newText = editTextarea.value.trim();
    if (!newText) { alert("Entry cannot be empty!"); return; }
    confirmEdit.textContent = "Saving...";
    await updateDoc(doc(db, "diary", editingDocId), { text: newText });
    modalOverlay.classList.add("hidden");
    editingDocId = null;
    confirmEdit.textContent = "Save Changes";
    loadEntries();
  };

  // Search
  searchEl.oninput = () => {
    const q = searchEl.value.toLowerCase();
    if (!q) { renderEntries(allEntries); return; }
    renderEntries(allEntries.filter(e => e.text.toLowerCase().includes(q)));
  };

  function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
});
</script>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>📔 My Cloud Diary</h2>
  <div class="input-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="your@email.com" autocomplete="username">
  </div>
  <div class="input-group">
    <label>Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button id="loginBtn">Login</button>
  <p id="msg"></p>
</div>

<!-- DIARY -->
<div id="diary" class="hidden">

  <div class="top-bar">
    <h2>📔 My Diary</h2>
    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="totalEntries">0</div>
      <div class="lbl">Total Entries</div>
    </div>
    <div class="stat-card">
      <div class="num" id="streak">0</div>
      <div class="lbl">Day Streak 🔥</div>
    </div>
    <div class="stat-card">
      <div class="num" id="totalWords">0</div>
      <div class="lbl">Words Written</div>
    </div>
  </div>

  <!-- Write -->
  <div class="write-box">
    <div class="mood-row">
      <label>Mood:</label>
      <button class="mood-btn" data-mood="😊 Happy">😊 Happy</button>
      <button class="mood-btn" data-mood="😔 Sad">😔 Sad</button>
      <button class="mood-btn" data-mood="😤 Frustrated">😤 Frustrated</button>
      <button class="mood-btn" data-mood="😌 Calm">😌 Calm</button>
      <button class="mood-btn" data-mood="🔥 Motivated">🔥 Motivated</button>
    </div>
    <textarea id="text" placeholder="What's on your mind today?"></textarea>
    <div class="write-footer">
      <span id="charCount">0 characters</span>
      <button id="saveBtn">✚ Save Entry</button>
    </div>
  </div>

  <!-- Search -->
  <input id="search" type="text" placeholder="🔍 Search your entries...">

  <!-- Entries -->
  <div id="entries"></div>

</div>

<!-- Edit Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Edit Entry</h3>
    <textarea id="editTextarea"></textarea>
    <div class="modal-footer">
      <button id="cancelEdit">Cancel</button>
      <button id="confirmEdit">Save Changes</button>
    </div>
  </div>
</div>

</body>
</html>
