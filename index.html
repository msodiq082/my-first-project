<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cloud Diary</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d0d0d; color: #f0f0f0; min-height: 100vh; padding: 20px; }

  /* LOGIN */
  #loginBox { max-width: 400px; margin: 80px auto; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 36px 32px; }
  #loginBox h2 { text-align:center; font-size:26px; margin-bottom:28px; }
  .input-group { margin-bottom: 14px; }
  .input-group label { display:block; font-size:13px; color:#888; margin-bottom:6px; }
  .input-group input { width:100%; padding:12px 16px; background:#111; border:1px solid #333; border-radius:10px; color:#f0f0f0; font-size:15px; outline:none; transition:border-color 0.2s; }
  .input-group input:focus { border-color:#7c6af7; }
  #loginBtn { width:100%; padding:13px; background:#7c6af7; color:white; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; }
  #loginBtn:hover { background:#6a58e0; }
  #msg { text-align:center; color:#e05757; font-size:14px; margin-top:12px; min-height:20px; }

  /* APP */
  #app { max-width: 900px; margin: 0 auto; display: none; }

  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .top-bar h2 { font-size:26px; font-weight:600; }
  #logoutBtn { background:#1f1f1f; border:1px solid #333; color:#aaa; padding:8px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
  #logoutBtn:hover { background:#2a2a2a; color:#f0f0f0; }

  /* LAYOUT ROW */
  .layout-row { display:flex; gap:16px; align-items:flex-start; }

  /* SIDE MENU */
  #sideMenu { width:120px; flex-shrink:0; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:14px; padding:10px 8px; position:sticky; top:20px; }
  .side-label { font-size:10px; color:#444; text-transform:uppercase; letter-spacing:1px; padding:0 6px; margin-bottom:8px; }
  .side-btn { display:block; width:100%; padding:9px 10px; background:transparent; border:none; border-radius:8px; color:#666; font-size:13px; text-align:left; cursor:pointer; transition:all 0.2s; margin-bottom:4px; }
  .side-btn:hover { background:#222; color:#ccc; }
  .side-btn.active { background:#2a2235; color:#a896f7; font-weight:600; }

  /* MAIN */
  #mainContent { flex:1; min-width:0; }

  /* STATS */
  .stats-row { display:flex; gap:12px; margin-bottom:20px; }
  .stat-card { flex:1; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:14px 16px; text-align:center; }
  .stat-card .num { font-size:24px; font-weight:700; color:#7c6af7; }
  .stat-card .lbl { font-size:12px; color:#666; margin-top:4px; }

  /* TABS */
  .tabs { display:flex; gap:8px; margin-bottom:24px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; padding:6px; }
  .tab-btn { flex:1; padding:10px; background:transparent; border:none; border-radius:8px; color:#888; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
  .tab-btn.active { background:#7c6af7; color:white; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  /* WRITE BOX */
  .write-box { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:16px; padding:20px; margin-bottom:20px; }
  .mood-row { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .mood-row label { font-size:13px; color:#888; }
  .mood-btn { background:#111; border:1px solid #333; border-radius:20px; padding:6px 14px; color:#ccc; font-size:14px; cursor:pointer; transition:all 0.2s; }
  .mood-btn:hover, .mood-btn.active { background:#7c6af7; border-color:#7c6af7; color:white; }
  .main-textarea { width:100%; background:#111; border:1px solid #2a2a2a; border-radius:10px; color:#f0f0f0; font-size:15px; padding:14px; resize:vertical; min-height:120px; outline:none; font-family:Arial,sans-serif; line-height:1.6; transition:border-color 0.2s; }
  .main-textarea:focus { border-color:#7c6af7; }
  .write-footer { display:flex; justify-content:space-between; align-items:center; margin-top:12px; }
  .char-count { font-size:13px; color:#555; }
  .save-btn { background:#7c6af7; color:white; border:none; border-radius:10px; padding:10px 24px; font-size:15px; font-weight:600; cursor:pointer; }
  .save-btn:hover { background:#6a58e0; }

  /* SEARCH */
  .search-input { width:100%; padding:12px 16px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; color:#f0f0f0; font-size:15px; outline:none; margin-bottom:16px; }
  .search-input:focus { border-color:#7c6af7; }

  /* ENTRIES */
  .entry { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .entry:hover { border-color:#3a3a3a; }
  .entry-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .entry-meta { display:flex; align-items:center; gap:10px; }
  .entry-date { font-size:13px; color:#666; }
  .entry-mood-tag { font-size:12px; background:#2a2a2a; border-radius:20px; padding:3px 10px; color:#aaa; }
  .entry-actions { display:flex; gap:8px; }
  .entry-actions button { background:#111; border:1px solid #2a2a2a; border-radius:8px; padding:6px 12px; color:#888; font-size:13px; cursor:pointer; transition:all 0.2s; }
  .entry-actions button:hover { background:#222; color:#f0f0f0; border-color:#444; }
  .del-btn:hover { color:#e05757 !important; border-color:#e05757 !important; }
  .entry-text { font-size:15px; line-height:1.7; color:#ccc; white-space:pre-wrap; word-break:break-word; }
  .entry-wordcount { font-size:12px; color:#444; margin-top:10px; }

  /* SIDE PANEL */
  #sidePanel { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:16px; padding:20px; margin-bottom:20px; }
  .side-panel-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .side-panel-header h3 { font-size:18px; }
  .entry-count { font-size:12px; color:#555; background:#222; border-radius:20px; padding:3px 10px; }

  /* PHOTOS */
  .upload-area { background:#1a1a1a; border:2px dashed #333; border-radius:16px; padding:36px 20px; text-align:center; margin-bottom:20px; cursor:pointer; }
  .upload-area:hover { border-color:#7c6af7; }
  .upload-area .icon { font-size:40px; }
  .upload-area p { color:#666; font-size:15px; margin-top:10px; }
  .upload-area p.sub { font-size:13px; color:#444; margin-top:4px; }
  #photoInput { display:none; }
  #uploadBtn { background:#7c6af7; color:white; border:none; border-radius:10px; padding:10px 28px; font-size:15px; font-weight:600; cursor:pointer; margin-top:14px; }
  #uploadBtn:hover { background:#6a58e0; }
  #uploadBtn:disabled { background:#444; cursor:not-allowed; }
  .upload-progress { margin-top:12px; font-size:14px; min-height:20px; }
  .progress-bar-wrap { background:#2a2a2a; border-radius:10px; height:6px; margin-top:8px; overflow:hidden; display:none; }
  .progress-bar { background:#7c6af7; height:100%; width:0%; border-radius:10px; transition:width 0.3s; }
  .photo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px; }
  .photo-card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden; }
  .photo-card:hover { border-color:#444; }
  .photo-card img { width:100%; height:140px; object-fit:cover; display:block; cursor:pointer; }
  .photo-card-footer { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
  .photo-date { font-size:11px; color:#555; }
  .photo-del { background:none; border:none; color:#555; cursor:pointer; font-size:16px; padding:2px 6px; }
  .photo-del:hover { color:#e05757; }

  /* LIGHTBOX */
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.92); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .lightbox img { max-width:100%; max-height:90vh; border-radius:10px; object-fit:contain; }
  .lightbox-close { position:fixed; top:20px; right:28px; font-size:32px; color:white; cursor:pointer; background:none; border:none; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; }
  .modal-box { background:#1a1a1a; border:1px solid #333; border-radius:16px; padding:28px; width:100%; max-width:520px; }
  .modal-box h3 { font-size:18px; margin-bottom:16px; }
  .modal-box textarea { width:100%; background:#111; border:1px solid #333; border-radius:10px; color:#f0f0f0; font-size:15px; padding:14px; resize:vertical; min-height:140px; outline:none; font-family:Arial,sans-serif; line-height:1.6; }
  .modal-box textarea:focus { border-color:#7c6af7; }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
  .modal-footer button { padding:10px 22px; border-radius:10px; font-size:15px; cursor:pointer; font-weight:600; border:1px solid #333; }
  #cancelEdit { background:#111; color:#aaa; }
  #confirmEdit { background:#7c6af7; color:white; border-color:#7c6af7; }

  .loading { text-align:center; color:#555; padding:30px; font-size:15px; }
  .empty-msg { text-align:center; color:#444; padding:40px; font-size:15px; }
  .hidden { display:none !important; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, orderBy, doc, deleteDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8hfYjGN1EgB7K8x77p_ky84ssuWS8EkI",
  authDomain: "my-diary-app-ee165.firebaseapp.com",
  projectId: "my-diary-app-ee165"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USER = "yusufsodiq082@gmail.com";
const PASS = "a336336a";
const IMGBB_KEY = "726546bc3df78bd73decd1c905972bc8";

let selectedMood = "";
let allEntries = [];
let editingDocId = null;
let editingCollection = "diary";
let currentSideSection = null;

window.addEventListener("DOMContentLoaded", () => {

  // LOGIN
  document.getElementById("loginBtn").onclick = () => {
    const email = document.getElementById("email").value.trim();
    const pass  = document.getElementById("password").value;
    if (email === USER && pass === PASS) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("app").style.display = "block";
      loadEntries();
      loadPhotos();
    } else {
      document.getElementById("msg").textContent = "❌ Incorrect email or password";
    }
  };
  document.getElementById("password").onkeydown = e => { if (e.key === "Enter") document.getElementById("loginBtn").click(); };

  // LOGOUT
  document.getElementById("logoutBtn").onclick = () => {
    document.getElementById("app").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("msg").textContent = "";
  };

  // MAIN TABS
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    };
  });

  // MOOD
  document.querySelectorAll(".mood-btn").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedMood = btn.dataset.mood;
    };
  });

  // CHAR COUNTS
  document.getElementById("text").oninput = () => {
    document.getElementById("charCount").textContent = document.getElementById("text").value.length + " characters";
  };
  document.getElementById("sideText").oninput = () => {
    document.getElementById("sideCharCount").textContent = document.getElementById("sideText").value.length + " characters";
  };

  // SAVE DIARY
  document.getElementById("saveBtn").onclick = async () => {
    const txt = document.getElementById("text").value.trim();
    if (!txt) { alert("Write something first!"); return; }
    const btn = document.getElementById("saveBtn");
    btn.textContent = "Saving..."; btn.disabled = true;
    await addDoc(collection(db, "diary"), { text: txt, mood: selectedMood, time: Date.now() });
    document.getElementById("text").value = "";
    document.getElementById("charCount").textContent = "0 characters";
    selectedMood = "";
    document.querySelectorAll(".mood-btn").forEach(b => b.classList.remove("active"));
    btn.textContent = "✚ Save Entry"; btn.disabled = false;
    loadEntries();
  };

  // LOAD DIARY
  async function loadEntries() {
    const div = document.getElementById("entries");
    div.innerHTML = '<div class="loading">Loading entries...</div>';
    const q = query(collection(db, "diary"), orderBy("time", "desc"));
    const snapshot = await getDocs(q);
    allEntries = [];
    snapshot.forEach(d => allEntries.push({ id: d.id, ...d.data() }));
    updateStats();
    renderEntries(allEntries, div, "diary", true);
  }

  function updateStats() {
    document.getElementById("totalEntries").textContent = allEntries.length;
    const w = allEntries.reduce((s, e) => s + e.text.trim().split(/\s+/).filter(Boolean).length, 0);
    document.getElementById("totalWords").textContent = w.toLocaleString();
    const days = new Set(allEntries.map(e => new Date(e.time).toDateString()));
    let streak = 0, d = new Date();
    while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
    document.getElementById("streak").textContent = streak;
  }

  function renderEntries(list, container, colName, showMood) {
    container.innerHTML = "";
    if (!list.length) { container.innerHTML = '<div class="empty-msg">Nothing here yet. Start writing! ✨</div>'; return; }
    list.forEach(entry => {
      const div = document.createElement("div");
      div.className = "entry";
      const date = new Date(entry.time).toLocaleString();
      const words = entry.text.trim().split(/\s+/).filter(Boolean).length;
      const mood = (showMood && entry.mood) ? `<span class="entry-mood-tag">${entry.mood}</span>` : "";
      div.innerHTML = `
        <div class="entry-header">
          <div class="entry-meta"><span class="entry-date">📅 ${date}</span>${mood}</div>
          <div class="entry-actions">
            <button class="editBtn">✏️ Edit</button>
            <button class="delBtn del-btn">🗑️ Delete</button>
          </div>
        </div>
        <div class="entry-text">${escapeHtml(entry.text)}</div>
        <div class="entry-wordcount">${words} words</div>
      `;
      container.appendChild(div);
      div.querySelector(".delBtn").onclick = async () => {
        if (confirm("Delete this entry?")) {
          await deleteDoc(doc(db, colName, entry.id));
          colName === "diary" ? loadEntries() : loadSideSection(colName);
        }
      };
      div.querySelector(".editBtn").onclick = () => {
        editingDocId = entry.id; editingCollection = colName;
        document.getElementById("editTextarea").value = entry.text;
        document.getElementById("modalOverlay").classList.remove("hidden");
      };
    });
  }

  // SEARCH
  document.getElementById("search").oninput = () => {
    const q = document.getElementById("search").value.toLowerCase();
    renderEntries(q ? allEntries.filter(e => e.text.toLowerCase().includes(q)) : allEntries, document.getElementById("entries"), "diary", true);
  };

  // EDIT MODAL
  document.getElementById("cancelEdit").onclick = () => { document.getElementById("modalOverlay").classList.add("hidden"); };
  document.getElementById("confirmEdit").onclick = async () => {
    const newText = document.getElementById("editTextarea").value.trim();
    if (!newText) return;
    document.getElementById("confirmEdit").textContent = "Saving...";
    await updateDoc(doc(db, editingCollection, editingDocId), { text: newText });
    document.getElementById("modalOverlay").classList.add("hidden");
    document.getElementById("confirmEdit").textContent = "Save Changes";
    editingCollection === "diary" ? loadEntries() : loadSideSection(editingCollection);
  };

  // SIDE BUTTONS
  const sideSections = {
    "btn-fikrlar":  { col: "fikrlar",  label: "F — Fikrlar",  placeholder: "Fikrlaringizni yozing..." },
    "btn-odamlar":  { col: "odamlar",  label: "O — Odamlar",  placeholder: "Odamlar haqida yozing..." },
    "btn-savollar": { col: "savollar", label: "S — Savollar", placeholder: "Savollaringizni yozing..." }
  };

  Object.entries(sideSections).forEach(([btnId, info]) => {
    document.getElementById(btnId).onclick = () => {
      const isOpen = currentSideSection === info.col;
      document.querySelectorAll(".side-btn").forEach(b => b.classList.remove("active"));
      if (isOpen) {
        document.getElementById("sidePanel").classList.add("hidden");
        currentSideSection = null;
        return;
      }
      document.getElementById(btnId).classList.add("active");
      document.getElementById("sidePanelTitle").textContent = info.label;
      document.getElementById("sideText").placeholder = info.placeholder;
      document.getElementById("sideText").value = "";
      document.getElementById("sideCharCount").textContent = "0 characters";
      document.getElementById("sidePanel").classList.remove("hidden");
      currentSideSection = info.col;
      loadSideSection(info.col);
    };
  });

  // SIDE SAVE
  document.getElementById("sideSaveBtn").onclick = async () => {
    const txt = document.getElementById("sideText").value.trim();
    if (!txt) { alert("Write something first!"); return; }
    const btn = document.getElementById("sideSaveBtn");
    btn.textContent = "Saving..."; btn.disabled = true;
    await addDoc(collection(db, currentSideSection), { text: txt, time: Date.now() });
    document.getElementById("sideText").value = "";
    document.getElementById("sideCharCount").textContent = "0 characters";
    btn.textContent = "✚ Save"; btn.disabled = false;
    loadSideSection(currentSideSection);
  };

  async function loadSideSection(colName) {
    const container = document.getElementById("sideEntries");
    container.innerHTML = '<div class="loading">Loading...</div>';
    const q = query(collection(db, colName), orderBy("time", "desc"));
    const snapshot = await getDocs(q);
    const items = [];
    snapshot.forEach(d => items.push({ id: d.id, ...d.data() }));
    document.getElementById("sideEntryCount").textContent = items.length + " entries";
    renderEntries(items, container, colName, false);
  }

  // PHOTOS
  document.getElementById("uploadArea").onclick = () => document.getElementById("photoInput").click();
  document.getElementById("uploadBtn").onclick = e => { e.stopPropagation(); document.getElementById("photoInput").click(); };

  document.getElementById("photoInput").onchange = async () => {
    const file = document.getElementById("photoInput").files[0];
    if (!file || !file.type.startsWith("image/")) { alert("Please select an image!"); return; }
    const btn = document.getElementById("uploadBtn");
    const status = document.getElementById("uploadStatus");
    const wrap = document.getElementById("progressWrap");
    const bar = document.getElementById("progressBar");
    btn.disabled = true; btn.textContent = "Uploading...";
    status.style.color = "#7c6af7"; status.textContent = "Uploading...";
    wrap.style.display = "block"; bar.style.width = "50%";
    try {
      const fd = new FormData();
      fd.append("image", file); fd.append("key", IMGBB_KEY);
      const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: fd });
      const result = await res.json();
      if (result.success) {
        await addDoc(collection(db, "photos"), { url: result.data.url, thumb: result.data.thumb?.url || result.data.url, time: Date.now() });
        bar.style.width = "100%";
        status.style.color = "#4caf88"; status.textContent = "✅ Uploaded!";
        document.getElementById("photoInput").value = "";
        setTimeout(() => { status.textContent = ""; wrap.style.display = "none"; bar.style.width = "0%"; }, 2500);
        loadPhotos();
      } else throw new Error("Failed");
    } catch { status.style.color = "#e05757"; status.textContent = "❌ Upload failed!"; wrap.style.display = "none"; }
    btn.disabled = false; btn.textContent = "📤 Upload Photo";
  };

  async function loadPhotos() {
    const grid = document.getElementById("photoGrid");
    grid.innerHTML = '<div class="loading">Loading photos...</div>';
    try {
      const q = query(collection(db, "photos"), orderBy("time", "desc"));
      const snap = await getDocs(q);
      if (snap.empty) { grid.innerHTML = '<div class="empty-msg">No photos yet! 📸</div>'; return; }
      grid.innerHTML = "";
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `<img src="${d.thumb||d.url}" loading="lazy"><div class="photo-card-footer"><span class="photo-date">${new Date(d.time).toLocaleDateString()}</span><button class="photo-del">🗑️</button></div>`;
        card.querySelector("img").onclick = () => { document.getElementById("lightboxImg").src = d.url; document.getElementById("lightbox").classList.remove("hidden"); };
        card.querySelector(".photo-del").onclick = async () => { if (confirm("Delete?")) { await deleteDoc(doc(db, "photos", docSnap.id)); loadPhotos(); } };
        grid.appendChild(card);
      });
    } catch { grid.innerHTML = '<div class="empty-msg" style="color:#e05757">Could not load photos.</div>'; }
  }

  document.getElementById("lightboxClose").onclick = () => document.getElementById("lightbox").classList.add("hidden");
  document.getElementById("lightbox").onclick = e => { if (e.target.id === "lightbox") document.getElementById("lightbox").classList.add("hidden"); };

  function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
});
</script>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>📔 My Cloud Diary</h2>
  <div class="input-group"><label>Email</label><input id="email" type="email" placeholder="your@email.com"></div>
  <div class="input-group"><label>Password</label><input id="password" type="password" placeholder="••••••••"></div>
  <button id="loginBtn">Login</button>
  <p id="msg"></p>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <h2>📔 My Diary</h2>
    <button id="logoutBtn">Logout</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="num" id="totalEntries">0</div><div class="lbl">Total Entries</div></div>
    <div class="stat-card"><div class="num" id="streak">0</div><div class="lbl">Day Streak 🔥</div></div>
    <div class="stat-card"><div class="num" id="totalWords">0</div><div class="lbl">Words Written</div></div>
  </div>

  <div class="layout-row">

    <!-- SIDE MENU -->
    <div id="sideMenu">
      <div class="side-label">Sections</div>
      <button class="side-btn" id="btn-fikrlar" title="Fikrlar">F</button>
      <button class="side-btn" id="btn-odamlar" title="Odamlar">O</button>
      <button class="side-btn" id="btn-savollar" title="Savollar">S</button>
    </div>

    <!-- MAIN CONTENT -->
    <div id="mainContent">

      <!-- Main Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="tabDiary">📝 Diary</button>
        <button class="tab-btn" data-tab="tabPhotos">📸 Photos</button>
      </div>

      <!-- DIARY TAB -->
      <div id="tabDiary" class="tab-panel active">

        <!-- Side Panel -->
        <div id="sidePanel" class="hidden">
          <div class="side-panel-header">
            <h3 id="sidePanelTitle"></h3>
            <span class="entry-count" id="sideEntryCount">0 entries</span>
          </div>
          <textarea class="main-textarea" id="sideText" style="min-height:90px;"></textarea>
          <div class="write-footer">
            <span class="char-count" id="sideCharCount">0 characters</span>
            <button class="save-btn" id="sideSaveBtn">✚ Save</button>
          </div>
          <div id="sideEntries" style="margin-top:16px;"></div>
        </div>

        <!-- Diary Write -->
        <div class="write-box">
          <div class="mood-row">
            <label>Mood:</label>
            <button class="mood-btn" data-mood="😊 Happy">😊 Happy</button>
            <button class="mood-btn" data-mood="😔 Sad">😔 Sad</button>
            <button class="mood-btn" data-mood="😤 Frustrated">😤 Frustrated</button>
            <button class="mood-btn" data-mood="😌 Calm">😌 Calm</button>
            <button class="mood-btn" data-mood="🔥 Motivated">🔥 Motivated</button>
          </div>
          <textarea class="main-textarea" id="text" placeholder="What's on your mind today?"></textarea>
          <div class="write-footer">
            <span class="char-count" id="charCount">0 characters</span>
            <button class="save-btn" id="saveBtn">✚ Save Entry</button>
          </div>
        </div>
        <input class="search-input" id="search" type="text" placeholder="🔍 Search your entries...">
        <div id="entries"></div>
      </div>

      <!-- PHOTOS TAB -->
      <div id="tabPhotos" class="tab-panel">
        <div class="upload-area" id="uploadArea">
          <div class="icon">🖼️</div>
          <p>Click here to choose a photo</p>
          <p class="sub">JPG, PNG, GIF — max 32MB</p>
          <input type="file" id="photoInput" accept="image/*">
          <button id="uploadBtn">📤 Upload Photo</button>
        </div>
        <div class="upload-progress" id="uploadStatus"></div>
        <div class="progress-bar-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
        <div id="photoGrid" class="photo-grid"></div>
      </div>

    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Edit Entry</h3>
    <textarea id="editTextarea"></textarea>
    <div class="modal-footer">
      <button id="cancelEdit">Cancel</button>
      <button id="confirmEdit">Save Changes</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox hidden">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="Photo">
</div>

</body>
</html>
